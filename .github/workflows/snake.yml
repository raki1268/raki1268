name: generate animation

on:
  schedule:
    - cron: "0 */24 * * *" # 每24小时运行一次
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#FFB7C5&color_dots=#ebedf0,#A7D08C,#7CB342,#388E3C,#1B5E20
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFB7C5&color_dots=#161b22,#A7D08C,#7CB342,#388E3C,#1B5E20
      - name: push github-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
